<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verilabel AI - Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* Makes "hidden" always win, so the role tabs really disappear on the sign up page. */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="login-page">

    <section class="login-left">
      <div class="brand">
        <span class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
        </span>
        Verilabel AI
      </div>
      <img class="login-art" src="/static/img/login-illustration.svg" alt="A man scanning a food label with his phone">
      <p class="tagline">Scan a label. Know what is inside.</p>
    </section>

    <section class="login-right">
      <div class="form-box">
        <div class="brand mobile-brand">Verilabel AI</div>
        <h1 id="title">LOGIN</h1>

        <div class="role-tabs" id="roleTabs" role="tablist" aria-label="Sign in as">
          <button type="button" class="role-tab active" data-role="customer" role="tab" aria-selected="true">Customer</button>
          <button type="button" class="role-tab" data-role="inspector" role="tab" aria-selected="false">Inspector</button>
          <button type="button" class="role-tab" data-role="admin" role="tab" aria-selected="false">Admin</button>
        </div>

        <div class="field">
          <label for="loginId" id="idLabel">Name</label>
          <div class="input-wrap">
            <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="#cfe8df" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-5 4-7.5 8.5-7.5s8.5 2.5 8.5 7.5z"/></svg></span>
            <input id="loginId" type="text" autocomplete="username">
          </div>
          <p class="hint hidden" id="nameHint">You will use this name to sign in.</p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="#cfe8df" aria-hidden="true"><path d="M7 10V8a5 5 0 0110 0v2h1.5a1.5 1.5 0 011.5 1.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 20.5v-9A1.5 1.5 0 015.5 10zm2 0h6V8a3 3 0 00-6 0z"/></svg></span>
            <input id="password" type="password" autocomplete="current-password">
          </div>
        </div>

        <div class="field hidden" id="confirmField">
          <label for="confirm">Confirm password</label>
          <div class="input-wrap">
            <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="#cfe8df" aria-hidden="true"><path d="M7 10V8a5 5 0 0110 0v2h1.5a1.5 1.5 0 011.5 1.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 20.5v-9A1.5 1.5 0 015.5 10zm2 0h6V8a3 3 0 00-6 0z"/></svg></span>
            <input id="confirm" type="password" autocomplete="new-password">
          </div>
        </div>

        <button class="btn" id="submitBtn" type="button">LOGIN</button>
        <div class="msg" id="msg" role="alert"></div>

        <p class="note hidden" id="staffNote">Inspector and Admin accounts are created by the Admin.</p>
        <div class="switch" id="switchBox">
          <span id="switchText">New here?</span>
          <button id="switchBtn" type="button">Sign up</button>
        </div>
      </div>
    </section>

  </div>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/demo-banner.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
